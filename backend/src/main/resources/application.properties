server.port=8080

# MongoDB Configuration (Local Dev / MongoDB Atlas compatible)
spring.data.mongodb.uri=mongodb://localhost:27017/edgecloud_db
spring.data.mongodb.auto-index-creation=true

# File Upload Settings for Task CSV Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.edgecloud.nsga2=DEBUG
